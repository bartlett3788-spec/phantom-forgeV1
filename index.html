                );
              })}
              {selectedForComp.length > 0 && (
                <button onClick={async () => {
                  setLoadingComp(true);
                  await onStartComp(accepted.filter(f => selectedForComp.includes(f.uid)));
                  setLoadingComp(false);
                }} style={{ ...btnStyle(T.orange), width: "100%", padding: "0.9rem", marginTop: "0.5rem", color: T.bg, opacity: loadingComp ? 0.6 : 1 }}>
                  {loadingComp ? "Generating Battle..." : `⚔️ Start Battle with ${selectedForComp.length} opponent${selectedForComp.length > 1 ? "s" : ""}`}
                </button>
              )}
            </div>
          ) : (
            <div style={{ textAlign: "center", padding: "2rem 1rem", color: T.text3 }}>
              <div style={{ fontSize: "2.5rem", marginBottom: "0.8rem" }}>⚔️</div>
              <div style={{ fontSize: "0.85rem" }}>Add friends first to start a competition.</div>
            </div>
          )}
        </>}
      </div>
    </div>
  );
}

// ─── COMPETITION DAY SESSION ──────────────────────────────────────────────────
function CompDay({ profile, compDay, friends, compScores, onBack, onComplete }) {
  const session = compDay?.session;
  const c = session?.color || T.orange;

  const [sets, setSets] = useState(() => {
    const init = {};
    (session?.exercises || []).forEach((ex, ei) => {
      init[ei] = Array.from({ length: ex.sets }, () => ({ weight: ex.targetWeight || 0, reps: parseInt(String(ex.reps).split("-")[0]) || 10, logged: false }));
    });
    return init;
  });
  const [openEx, setOpenEx] = useState(0);
  const [restSecs, setRestSecs] = useState(0);
  const [restTotal, setRestTotal] = useState(0);
  const [showRest, setShowRest] = useState(false);
  const [startTime] = useState(Date.now());
  const restRef = useRef(null);

  useEffect(() => {
    if (showRest && restSecs > 0) {
      restRef.current = setInterval(() => setRestSecs(s => {
        if (s <= 1) { clearInterval(restRef.current); setShowRest(false); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); return 0; }
        return s - 1;
      }), 1000);
    } else clearInterval(restRef.current);
    return () => clearInterval(restRef.current);
  }, [showRest, restSecs]);

  function logSet(ei, si) {
    const w = parseFloat(document.getElementById(`cw${ei}-${si}`)?.value) || 0;
    const r = parseInt(document.getElementById(`cr${ei}-${si}`)?.value) || 0;
    setSets(prev => {
      const n = { ...prev };
      n[ei] = [...n[ei]];
      n[ei][si] = { weight: w, reps: r, logged: true };
      if (si + 1 < n[ei].length) n[ei][si + 1] = { ...n[ei][si + 1], weight: w, reps: r };
      return n;
    });
    const ex = session.exercises[ei];
    const hasMore = si < ex.sets - 1;
    if (hasMore) { setRestTotal(ex.restSeconds || 75); setRestSecs(ex.restSeconds || 75); setShowRest(true); }
  }

  const totalSets = Object.values(sets).flat().length;
  const doneSets = Object.values(sets).flat().filter(s => s.logged).length;
  const pct = totalSets ? (doneSets / totalSets * 100) : 0;
  const allDone = doneSets === totalSets;
  let liveVol = 0;
  Object.values(sets).flat().forEach(s => { if (s.logged) liveVol += s.weight * s.reps; });

  // Live leaderboard while doing comp
  const participants = [
    { uid: profile.uid, username: profile.username, name: profile.name, score: liveVol, isMe: true },
    ...Object.values(compScores).filter(s => s.uid !== profile.uid).map(s => ({ ...s, isMe: false }))
  ].sort((a, b) => b.score - a.score);

  if (!session) return <div style={appShell}><div style={topBar}><button onClick={onBack} style={backBtn}>← Back</button></div><div style={{ padding: "2rem", textAlign: "center", color: T.text3 }}>No competition session found.</div></div>;

  return (
    <div style={appShell}>
      <div style={{ background: `linear-gradient(135deg, ${c}22, ${T.s1})`, padding: "1rem 1.2rem", borderBottom: `1px solid ${c}33`, flexShrink: 0 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div style={{ fontFamily: "'Barlow Condensed',sans-serif", fontWeight: 900, fontSize: "0.7rem", textTransform: "uppercase", letterSpacing: "0.18em", color: c, marginBottom: "0.2rem" }}>⚔️ Competition Day</div>
            <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "1.8rem", letterSpacing: "0.06em", lineHeight: 1, color: T.text }}>{session.name}</div>
            <div style={{ fontSize: "0.75rem", color: T.text2, marginTop: "0.2rem", fontStyle: "italic" }}>{session.tagline}</div>
          </div>
          <button onClick={onBack} style={{ ...backBtn, color: T.text3 }}>← Back</button>
        </div>
        {/* Mini leaderboard */}
        <div style={{ marginTop: "0.8rem", display: "flex", gap: "0.4rem", overflowX: "auto" }}>
          {participants.map((p, i) => (
            <div key={p.uid} style={{ flexShrink: 0, textAlign: "center", background: p.isMe ? c + "22" : T.s2, border: `1px solid ${p.isMe ? c : T.border}`, borderRadius: 8, padding: "0.4rem 0.6rem", minWidth: 60 }}>
              <div style={{ fontSize: "0.65rem", color: i === 0 ? T.yellow : T.text3, fontWeight: 900 }}>{i === 0 ? "🥇" : `#${i + 1}`}</div>
              <div style={{ fontFamily: "'Barlow Condensed',sans-serif", fontWeight: 900, fontSize: "0.75rem", color: p.isMe ? c : T.text2 }}>@{p.username}</div>
              <div style={{ fontFamily: "'Barlow Condensed',sans-serif", fontWeight: 900, fontSize: "1rem", color: p.isMe ? c : T.text }}>{p.score.toLocaleString()}</div>
              <div style={{ fontSize: "0.55rem", color: T.text3 }}>pts</div>
            </div>
          ))}
        </div>
        {/* Progress */}
        <div style={{ marginTop: "0.7rem", height: 4, background: T.s3, borderRadius: 2, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${pct}%`, background: c, borderRadius: 2, transition: "width 0.4s" }} />
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "0.8rem 1.2rem 6rem" }}>
        {(session.exercises || []).map((ex, ei) => {
          const exSets = sets[ei] || [];
          const exDone = exSets.every(s => s.logged);
          const isOpen = openEx === ei;
          return (
            <div key={ei} style={{ background: T.s1, border: `1.5px solid ${exDone ? T.green + "55" : c + "22"}`, borderRadius: 14, marginBottom: "0.7rem", overflow: "hidden", opacity: exDone ? 0.78 : 1 }}>
              <div onClick={() => setOpenEx(isOpen ? null : ei)} style={{ display: "flex", alignItems: "center", gap: "0.8rem", padding: "0.85rem 1rem", cursor: "pointer", userSelect: "none" }}>
                <span style={{ fontFamily: "'Barlow Condensed',sans-serif", fontWeight: 900, fontSize: "0.95rem", color: c, minWidth: 22 }}>{String(ei + 1).padStart(2, "0")}</span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, fontSize: "0.9rem" }}>{ex.name}</div>
                  <div style={{ fontSize: "0.7rem", color: T.text2, marginTop: 2 }}>{ex.sets}×{ex.reps} · <span style={{ color: T.yellow }}>{ex.targetWeight}kg target</span> · {ex.muscles}</div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <span style={{ fontFamily: "'Barlow Condensed',sans-serif", fontWeight: 900, fontSize: "1.1rem", color: exDone ? T.green : T.text3 }}>{exSets.filter(s => s.logged).length}/{ex.sets}</span>
                  <span style={{ fontSize: "0.65rem", color: T.text3, marginLeft: 4, display: "inline-block", transform: isOpen ? "rotate(180deg)" : "none" }}>▾</span>
                </div>
              </div>
              {isOpen && (
                <div style={{ padding: "0 1rem 1rem" }}>
                  {ex.tip && <div style={{ fontSize: "0.73rem", color: T.text2, lineHeight: 1.5, background: T.s2, borderRadius: 8, padding: "0.55rem 0.75rem", marginBottom: "0.7rem", borderLeft: `3px solid ${c}` }}>💡 {ex.tip}</div>}
                  <div style={{ display: "grid", gridTemplateColumns: "28px 1fr 1fr 56px", gap: "0.4rem", padding: "0 0.2rem 0.35rem", fontSize: "0.6rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", color: T.text3 }}>
                    <span>SET</span><span>KG</span><span>REPS</span><span></span>
                  </div>
                  {exSets.map((set, si) => {
                    const isDone = set.logged;
                    const isNext = !isDone && exSets.slice(0, si).every(s => s.logged);
                    return (
                      <div key={si} style={{ display: "grid", gridTemplateColumns: "28px 1fr 1fr 56px", gap: "0.4rem", alignItems: "center", padding: "0.45rem 0.2rem", borderRadius: 8, background: isDone ? "rgba(34,211,160,0.07)" : isNext ? c + "0f" : "transparent" }}>
                        <span style={{ fontFamily: "'Barlow Condensed',sans-serif", fontWeight: 900, fontSize: "0.95rem", color: isDone ? T.green : T.text3, textAlign: "center" }}>{isDone ? "✓" : si + 1}</span>
                        <input id={`cw${ei}-${si}`} type="number" step="2.5" min="0" max="200" defaultValue={set.weight} readOnly={isDone}
                          style={{ background: T.s2, border: `1.5px solid ${isDone ? T.green + "66" : T.border}`, borderRadius: 8, padding: "0.42rem 0.4rem", color: T.text, textAlign: "center", width: "100%", outline: "none", fontFamily: "inherit", fontWeight: 700, fontSize: "0.88rem", WebkitAppearance: "none" }} />
                        <input id={`cr${ei}-${si}`} type="number" step="1" min="0" max="100" defaultValue={set.reps} readOnly={isDone}
                          style={{ background: T.s2, border: `1.5px solid ${isDone ? T.green + "66" : T.border}`, borderRadius: 8, padding: "0.42rem 0.4rem", color: T.text, textAlign: "center", width: "100%", outline: "none", fontFamily: "inherit", fontWeight: 700, fontSize: "0.88rem", WebkitAppearance: "none" }} />
                        {isDone
                          ? <button onClick={() => setSets(p => { const n = {...p}; n[ei] = [...n[ei]]; n[ei][si] = {...n[ei][si], logged: false}; return n; })} style={{ background: T.s3, border: "none", borderRadius: 8, padding: "0.42rem 0", color: T.text2, fontSize: "0.6rem", fontWeight: 900, cursor: "pointer", width: "100%", fontFamily: "inherit", textTransform: "uppercase" }}>UNDO</button>
                          : <button onClick={() => logSet(ei, si)} style={{ background: c, border: "none", borderRadius: 8, padding: "0.42rem 0", color: T.bg, fontSize: "0.7rem", fontWeight: 900, cursor: "pointer", width: "100%", fontFamily: "'Barlow Condensed',sans-serif", textTransform: "uppercase" }}>LOG</button>}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
        {session.scoringNote && <div style={{ background: T.s2, borderRadius: 10, padding: "0.7rem 1rem", fontSize: "0.75rem", color: T.text2, borderLeft: `3px solid ${T.yellow}`, marginTop: "0.5rem" }}>🏆 Scoring: {session.scoringNote}</div>}
      </div>

      <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 500, background: T.s1, borderTop: `1px solid ${T.border}`, padding: "0.8rem 1.2rem 1rem", display: "flex", gap: "0.8rem", alignItems: "center" }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: "'Barlow Condensed',sans-serif", fontWeight: 900, fontSize: "1.2rem", color: c }}>{liveVol.toLocaleString()} pts</div>
          <div style={{ height: 4, background: T.s3, borderRadius: 2, overflow: "hidden", marginTop: 3 }}>
            <div style={{ height: "100%", width: `${pct}%`, background: c, borderRadius: 2, transition: "width 0.4s" }} />
          </div>
        </div>
        <button onClick={() => onComplete({ sets, elapsed: Math.round((Date.now()-startTime)/60000), totalVol: liveVol })} disabled={!allDone}
          style={{ ...btnStyle(allDone ? T.green : T.s3), opacity: allDone ? 1 : 0.5, color: allDone ? T.bg : T.text3, padding: "0.65rem 1.2rem", whiteSpace: "nowrap" }}>
          Submit Score 🏆
        </button>
      </div>

      {showRest && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,16,0.96)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", zIndex: 100 }}>
          <div style={{ fontSize: "0.72rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.2em", color: T.text3, marginBottom: "0.5rem" }}>Rest</div>
          <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "5.5rem", letterSpacing: "0.05em", lineHeight: 1, color: restSecs <= 10 ? T.red : c }}>
            {Math.floor(restSecs / 60)}:{String(restSecs % 60).padStart(2, "0")}
          </div>
          <div style={{ width: 180, height: 4, background: T.s3, borderRadius: 2, marginTop: "1rem", overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${restTotal ? (restSecs/restTotal*100) : 0}%`, background: c, borderRadius: 2, transition: "width 1s linear" }} />
          </div>
          <div style={{ display: "flex", gap: "0.8rem", marginTop: "1.5rem" }}>
            <button onClick={() => { setRestSecs(s=>s+15); setRestTotal(t=>t+15); }} style={{ fontFamily: "'Barlow Condensed',sans-serif", fontWeight: 900, fontSize: "0.85rem", textTransform: "uppercase", padding: "0.6rem 1.1rem", borderRadius: 10, cursor: "pointer", background: T.s2, border: `1.5px solid ${T.border}`, color: T.text2 }}>+15s</button>
            <button onClick={() => setShowRest(false)} style={{ fontFamily: "'Barlow Condensed',sans-serif", fontWeight: 900, fontSize: "0.85rem", textTransform: "uppercase", padding: "0.6rem 1.4rem", borderRadius: 10, cursor: "pointer", background: T.s2, border: `1.5px solid ${T.border}`, color: T.text2 }}>Skip</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── COMPETITION LEADERBOARD ──────────────────────────────────────────────────
function CompLeaderboard({ profile, compDay, compScores, friends, onBack, onRefresh }) {
  const [refreshing, setRefreshing] = useState(false);
  const session = compDay?.session;
  const c = session?.color || T.orange;

  const allScores = Object.values(compScores).sort((a, b) => b.score - a.score);
  const myScore = compScores[profile.uid];
  const myRank = allScores.findIndex(s => s.uid === profile.uid) + 1;
  const medals = ["🥇", "🥈", "🥉"];

  async function handleRefresh() {
    setRefreshing(true);
    await onRefresh();
    setRefreshing(false);
  }

  return (
    <div style={appShell}>
      <div style={{ background: `linear-gradient(135deg, ${c}22, ${T.s1})`, padding: "1.2rem", borderBottom: `1px solid ${c}33`, flexShrink: 0 }}>
        <div style={{ fontFamily: "'Barlow Condensed',sans-serif", fontWeight: 900, fontSize: "0.7rem", textTransform: "uppercase", letterSpacing: "0.18em", color: c, marginBottom: "0.3rem" }}>⚔️ Battle Results</div>
        <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "2rem", letterSpacing: "0.06em", lineHeight: 1, color: T.text }}>{session?.name}</div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "1.2rem 1.2rem 5rem" }}>
        {/* Your result */}
        {myScore && (
          <div style={{ background: `linear-gradient(135deg, ${c}22, ${c}08)`, border: `2px solid ${c}`, borderRadius: 16, padding: "1.2rem", marginBottom: "1.2rem", textAlign: "center" }}>
            <div style={{ fontSize: "2.5rem", marginBottom: "0.4rem" }}>{medals[myRank - 1] || "🏅"}</div>
            <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "1.2rem", letterSpacing: "0.05em", color: c }}>You ranked #{myRank}</div>
            <div style={{ fontFamily: "'Barlow Condensed',sans-serif", fontWeight: 900, fontSize: "3rem", color: T.text, lineHeight: 1, margin: "0.3rem 0" }}>{myScore.score.toLocaleString()}</div>
            <div style={{ fontSize: "0.72rem", color: T.text3, textTransform: "uppercase", letterSpacing: "0.1em" }}>competition points</div>
          </div>
        )}

        {/* Full leaderboard */}
        <div style={{ marginBottom: "1rem" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "0.8rem" }}>
            <div style={{ fontSize: "0.72rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.12em", color: T.text3 }}>Leaderboard</div>
            <button onClick={handleRefresh} style={{ background: "transparent", border: `1px solid ${T.border}`, borderRadius: 6, padding: "0.25rem 0.7rem", fontSize: "0.7rem", color: T.text3, cursor: "pointer", fontFamily: "inherit" }}>
              {refreshing ? "⟳" : "↻ Refresh"}
            </button>
          </div>
          {allScores.length === 0 ? (
            <div style={{ textAlign: "center", padding: "1.5rem", color: T.text3, fontSize: "0.85rem" }}>Waiting for others to submit their scores...</div>
          ) : (
            allScores.map((s, i) => {
              const isMe = s.uid === profile.uid;
              return (
                <div key={s.uid} style={{ display: "flex", alignItems: "center", gap: "0.8rem", padding: "0.85rem 1rem", borderRadius: 12, border: `1.5px solid ${isMe ? c : T.border}`, background: isMe ? c + "12" : T.s1, marginBottom: "0.5rem" }}>
                  <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "1.5rem", width: 32, textAlign: "center" }}>{medals[i] || `#${i + 1}`}</div>
                  <div style={{ width: 36, height: 36, borderRadius: "50%", background: isMe ? c + "33" : T.s3, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Bebas Neue',sans-serif", fontSize: "1rem", color: isMe ? c : T.text3 }}>{s.name?.[0]?.toUpperCase()}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, fontSize: "0.88rem", color: isMe ? c : T.text }}>{s.name} {isMe && <span style={{ fontSize: "0.7rem", color: T.text3 }}>(you)</span>}</div>
                    <div style={{ fontSize: "0.7rem", color: T.text3 }}>@{s.username}</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontFamily: "'Barlow Condensed',sans-serif", fontWeight: 900, fontSize: "1.4rem", color: isMe ? c : T.text }}>{s.score.toLocaleString()}</div>
                    <div style={{ fontSize: "0.58rem", color: T.text3, textTransform: "uppercase", letterSpacing: "0.1em" }}>pts</div>
                  </div>
                </div>
              );
            })
          )}
        </div>

        {allScores.length < (compDay?.participants?.length || 0) && (
          <div style={{ background: T.s2, borderRadius: 10, padding: "0.7rem 1rem", fontSize: "0.78rem", color: T.text2, textAlign: "center", borderLeft: `3px solid ${T.yellow}` }}>
            ⏳ Waiting on {(compDay.participants.length) - allScores.length} more result{(compDay.participants.length - allScores.length) !== 1 ? "s" : ""}...
          </div>
        )}
      </div>

      <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 500, background: T.s1, borderTop: `1px solid ${T.border}`, padding: "0.8rem 1.2rem 1rem" }}>
        <button onClick={onBack} style={{ ...btnStyle(T.s3), width: "100%", border: `1.5px solid ${T.border}`, color: T.text2 }}>← Back to Squad</button>
      </div>
    </div>
  );
}


const appShell = { background: "#000000", minHeight: "100vh", display: "flex", flexDirection: "column", maxWidth: 500, margin: "0 auto", fontFamily: "'Barlow', sans-serif", color: "#f0f0f0" };
const topBar = { padding: "0.8rem 1.2rem", borderBottom: `1px solid ${T.border}`, background: "#050505", flexShrink: 0, display: "flex", alignItems: "center", gap: "0.8rem" };
const topBarTitle = { fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 900, fontSize: "1rem", textTransform: "uppercase", letterSpacing: "0.05em" };
const backBtn = { background: "transparent", border: "none", color: T.text3, fontSize: "0.82rem", cursor: "pointer", fontFamily: "inherit", padding: "0.2rem 0", fontWeight: 700 };
const btnStyle = (bg) => ({ background: bg, border: "none", borderRadius: 10, padding: "0.7rem 1.2rem", fontSize: "0.88rem", fontWeight: 900, cursor: "pointer", fontFamily: "'Barlow Condensed', sans-serif", textTransform: "uppercase", letterSpacing: "0.08em", color: bg === T.accent || bg === T.green || bg === T.yellow ? "#000000" : "#000000" });


    ReactDOM.createRoot(document.getElementById('root')).render(<FitForge />);
  </script>
</body>
</html>
